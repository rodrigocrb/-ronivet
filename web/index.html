<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <title>RoniVet</title>
</head>
<body>
  <header class="topo" id="topo" hidden>
    <button id="abrir-menu" class="hamburguer" type="button" aria-label="Abrir menu"
      aria-expanded="false" aria-controls="gaveta"><span></span><span></span><span></span></button>
    <span class="logo" id="logo-topo" aria-hidden="true"></span>
    <strong>RoniVet</strong>
    <span id="rede" aria-live="polite"></span>
    <button id="pendencias" type="button" hidden></button>
  </header>

  <div id="gaveta-fundo" hidden></div>
  <aside class="gaveta" id="gaveta" aria-label="Menu" hidden>
    <div class="gaveta-pessoa"><strong id="usuario"></strong><small id="usuario-perfil"></small></div>
    <nav id="menu" aria-label="Principal"></nav>
    <button id="sair" type="button" class="gaveta-sair">Sair</button>
  </aside>

  <main id="app" aria-live="polite">
    <p>Carregando…</p>
  </main>

  <script src="/mascote.js" defer></script>
  <script src="/tipos-util.js" defer></script>
  <script src="/transporte.js" defer></script>
  <script src="/google.js" defer></script>
  <script src="/documento-ui.js" defer></script>
  <script src="/nucleo.js" defer></script>
  <script src="/repositorio-local.js" defer></script>
  <script src="/ambiente-local.js" defer></script>
  <script src="/registro.js" defer></script>
  <script src="/pdf-texto.js" defer></script>
  <script src="/documento-local.js" defer></script>
  <script src="/local.js" defer></script>
  <script src="/drive-rest.js" defer></script>
  <script src="/raiz.js" defer></script>
  <script src="/sincronizacao.js" defer></script>
  <script src="/agendador.js" defer></script>
  <script src="/docx.js" defer></script>
  <script src="/documento-fluxo.js" defer></script>
  <script src="/sync-app.js" defer></script>
  <script src="/agenda.js" defer></script>
  <script src="/atendimento.js" defer></script>
  <script src="/relatorios.js" defer></script>
  <script src="/config.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
